        /* Cuadrícula simple */
        .contenedor { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
        }

        .tarjeta { 
            background: #111; border: 1px solid #333; width: 170px; 
            border-radius: 8px; overflow: hidden; cursor: pointer;
        }

        /* Centrado de imagen garantizado */
        .caja-foto { 
            width: 170px; height: 220px; background: #222; 
            display: flex; align-items: center; justify-content: center;
        }
        .caja-foto img { 
            width: 100%; height: 100%; object-fit: cover; /* Esto centra y ajusta */
        }

        .titulo { padding: 10px; font-size: 13px; font-weight: bold; }

        /* Ventana de información */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-contenido { background: #1a1a1a; padding: 20px; border: 2px solid #003791; width: 300px; text-align: left; border-radius: 10px; }
    </style>

    function mostrar(datos) {
        const caja = document.getElementById('lista-juegos');
        caja.innerHTML = '';
        datos.forEach(j => {
            const div = document.createElement('div');
            div.className = 'tarjeta';
            div.onclick = () => {
                document.getElementById('txt-titulo').innerText = j.t;
                document.getElementById('txt-anio').innerText = j.a;
                document.getElementById('txt-peso').innerText = j.p;
                document.getElementById('txt-info').innerText = j.d;
                document.getElementById('miModal').style.display = 'flex';
            };
            div.innerHTML = `
                <div class="caja-foto">
                    <img src="fotos/${j.i}" onerror="this.parentElement.innerHTML='<small>Falta fotos/${j.i}</small>'">
                </div>
                <div class="titulo">${j.t}</div>
            `;
            caja.appendChild(div);
        });
    }

    function buscar() {
        const texto = document.getElementById('motor-busqueda').value.toLowerCase();
        const filtrados = inventario.filter(j => j.t.toLowerCase().includes(texto));
        mostrar(filtrados);
    }

    mostrar(inventario);
